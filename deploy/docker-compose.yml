services:
  postgres:
    image: pe-review-postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: pe_review
      POSTGRES_USER: pe_review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pe_review -d pe_review"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${REVIEWER_IMAGE:-gerrit-ai-reviewer:local}
    command: ["migrate"]
    restart: "no"
    environment: &review-env
      PE_REVIEW_CONFIG: /etc/pe-review-agent/config.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PE_REVIEW_LLM_API_KEY: ${PE_REVIEW_LLM_API_KEY:-}
      PE_REVIEW_GERRIT_HTTP_PASSWORD: ${PE_REVIEW_GERRIT_HTTP_PASSWORD:-}
      PE_REVIEW_GERRIT_TOKEN: ${PE_REVIEW_GERRIT_TOKEN:-}
      PE_REVIEW_COMPONENT: migrate
      PE_REVIEW_LOG_FILE: /var/lib/pe-review-agent/logs/migrate.jsonl
    volumes: &review-volumes
      - ./config.yaml:/etc/pe-review-agent/config.yaml:ro
      - ./secrets/gerrit_ssh_key:/run/secrets/gerrit_ssh_key:ro
      - ./secrets/gerrit_known_hosts:/run/secrets/gerrit_known_hosts:ro
      # If the corporate HTTPS endpoints use a private CA, also mount it and set
      # gerrit.ca_bundle_path / llm.ca_bundle_path in config.yaml.
      # - ./secrets/corporate_ca.pem:/run/secrets/corporate_ca.pem:ro
      - repo-data:/var/lib/pe-review-agent
    depends_on:
      postgres:
        condition: service_healthy

  receiver:
    image: ${REVIEWER_IMAGE:-gerrit-ai-reviewer:local}
    command: ["receiver"]
    restart: unless-stopped
    environment:
      <<: *review-env
      PE_REVIEW_COMPONENT: receiver
      PE_REVIEW_LOG_FILE: /var/lib/pe-review-agent/logs/receiver.jsonl
    volumes: *review-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${REVIEWER_IMAGE:-gerrit-ai-reviewer:local}
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *review-env
      PE_REVIEW_COMPONENT: worker
      PE_REVIEW_LOG_FILE: /var/lib/pe-review-agent/logs/worker.jsonl
    volumes: *review-volumes
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  reconciler:
    image: ${REVIEWER_IMAGE:-gerrit-ai-reviewer:local}
    command: ["reconcile"]
    restart: unless-stopped
    environment:
      <<: *review-env
      PE_REVIEW_COMPONENT: reconciler
      PE_REVIEW_LOG_FILE: /var/lib/pe-review-agent/logs/reconciler.jsonl
    volumes: *review-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    image: ${REVIEWER_IMAGE:-gerrit-ai-reviewer:local}
    command: ["admin"]
    restart: unless-stopped
    environment:
      <<: *review-env
      PE_REVIEW_ADMIN_PASSWORD: ${PE_REVIEW_ADMIN_PASSWORD:?set PE_REVIEW_ADMIN_PASSWORD}
      PE_REVIEW_COMPONENT: admin
      PE_REVIEW_LOG_FILE: /var/lib/pe-review-agent/logs/admin.jsonl
    volumes: *review-volumes
    ports:
      - "${ADMIN_BIND_ADDRESS:-0.0.0.0}:${ADMIN_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  repo-data:
