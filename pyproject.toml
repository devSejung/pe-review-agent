[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gerrit-ai-reviewer"
version = "0.1.0"
description = "Durable Gerrit AI review worker for firmware repositories"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0.2,<7",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]
pr-agent = [
  # Intentionally not pinned here. Runtime integration is optional and the
  # exact upstream revision is recorded separately after compatibility review.
]

[project.scripts]
pe-review-agent = "pe_review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
