gerrit:
  ssh_host: "gerrit.example.internal"
  ssh_port: 29418
  ssh_user: "pe-review-agent"
  ssh_key_path: "/run/secrets/gerrit_ssh_key"
  known_hosts_path: "/run/secrets/gerrit_known_hosts"
  strict_host_key_checking: true
  rest_url: "https://gerrit.example.internal"
  # ca_bundle_path: "/run/secrets/corporate_ca.pem"
  rest_auth:
    mode: "basic"
    username: "pe-review-agent"
    password_env: "PE_REVIEW_GERRIT_HTTP_PASSWORD"
  # Optional bootstrap allowlist. Leave empty and add/test projects from the Admin Web on :8080.
  projects: []
  review_tag: "autogenerated:pe-ai-review"
  notify: "OWNER"
  max_comment_bytes: 16384

llm:
  base_url: "https://qwen-api.example.internal/v1"
  model: "Qwen3.6-27B"
  api_key_env: "PE_REVIEW_LLM_API_KEY"
  request_timeout_seconds: 180
  concurrency: 2
  temperature: 0.1
  max_output_tokens: 6000
  # ca_bundle_path: "/run/secrets/corporate_ca.pem"

database:
  host: "postgres"
  port: 5432
  username: "pe_review"
  database: "pe_review"
  password_env: "POSTGRES_PASSWORD"

repos:
  cache_root: "/var/lib/pe-review-agent/repos"
  work_root: "/var/lib/pe-review-agent/work"
  max_diff_bytes: 4000000

review:
  policy_version: "firmware-v1"
  max_findings: 8
  min_confidence: 0.82
  max_tool_rounds: 8
  max_policy_bytes: 128000
  max_diff_chunk_chars: 70000
  max_candidate_findings_total: 64
  tool_command_timeout_seconds: 20
  max_tool_output_bytes: 256000

retry:
  fetch_attempts: 4
  review_attempts: 4
  publish_attempts: 8
  base_seconds: 2
  max_seconds: 300
  jitter_ratio: 0.2

service:
  # Emergency kill switch. Set false and restart services to stop ingest/review/reconciliation
  # without deleting durable jobs or review results.
  enabled: true
  worker_concurrency: 2
  claim_lease_seconds: 900
  poll_interval_seconds: 2
  reconcile_interval_seconds: 300
  # Periodically ignore the incremental watermark and rescan all open allowlisted Changes so a
  # temporarily stale Gerrit search index cannot permanently hide a missed Patch Set.
  reconcile_full_sweep_interval_seconds: 3600
  health_host: "0.0.0.0"
  # Worker-only health/metrics endpoint. Admin Web owns host port 8080.
  health_port: 8081

admin:
  host: "0.0.0.0"
  port: 8080
  auth_mode: "basic"
  username: "admin"
  password_env: "PE_REVIEW_ADMIN_PASSWORD"
  log_root: "/var/lib/pe-review-agent/logs"
