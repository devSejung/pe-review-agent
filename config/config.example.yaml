gerrit:
  ssh_host: "gerrit.example.internal"
  ssh_port: 29418
  ssh_user: "pe-review-agent"
  ssh_key_path: "/run/secrets/gerrit_ssh_key"
  known_hosts_path: "/run/secrets/gerrit_known_hosts"
  strict_host_key_checking: true
  rest_url: "https://gerrit.example.internal"
  rest_auth:
    mode: "basic"
    username: "pe-review-agent"
    password_env: "PE_REVIEW_GERRIT_HTTP_PASSWORD"
  projects:
    - "team/firmware/example"
  review_tag: "autogenerated:pe-ai-review"
  notify: "OWNER"

llm:
  base_url: "https://qwen-api.example.internal/v1"
  model: "Qwen3.6-27B"
  api_key_env: "PE_REVIEW_LLM_API_KEY"
  request_timeout_seconds: 180
  concurrency: 2
  temperature: 0.1
  max_output_tokens: 6000

database:
  dsn: "postgresql+asyncpg://pe_review:CHANGE_ME@postgres:5432/pe_review"

repos:
  cache_root: "/var/lib/pe-review-agent/repos"
  work_root: "/var/lib/pe-review-agent/work"

review:
  policy_version: "firmware-v1"
  max_findings: 8
  min_confidence: 0.82
  max_tool_rounds: 8

retry:
  fetch_attempts: 4
  review_attempts: 4
  publish_attempts: 8
  base_seconds: 2
  max_seconds: 300
  jitter_ratio: 0.2

service:
  worker_concurrency: 2
  claim_lease_seconds: 900
  poll_interval_seconds: 2
  reconcile_interval_seconds: 300
  health_host: "0.0.0.0"
  health_port: 8080
